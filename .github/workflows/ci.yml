name: TraceBot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tracebot/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Verify app loads
        run: |
          python -c "from tracebot.main import app; print('App loads OK')"

      - name: Start server and test endpoints
        run: |
          uvicorn tracebot.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/
          echo "All endpoints responding"

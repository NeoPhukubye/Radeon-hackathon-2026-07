services:
  - type: web
    name: tracebot
    runtime: python
    buildCommand: pip install -r tracebot/requirements.txt
    startCommand: uvicorn tracebot.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TRACEBOT_REPO_PATH
        value: /opt/render/project/src
      - key: TRACEBOT_MODEL
        value: gemini-3.5-flash-lite
      - key: TRACEBOT_MAX_DEBUG
        value: "3"
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard — never commit the real value
